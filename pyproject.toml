[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroshift"
version = "0.1.0"
description = "AI beyond neural networks: Hyperdimensional Computing, Self-Evolving Architectures, and Swarm Intelligence"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Bilal"},
]
keywords = [
    "hyperdimensional-computing",
    "neuroevolution",
    "self-modifying-networks",
    "swarm-intelligence",
    "anomaly-detection",
    "few-shot-learning",
    "edge-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark",
]

[project.urls]
Homepage = "https://github.com/bilal/neuroshift"
Repository = "https://github.com/bilal/neuroshift"

[tool.setuptools.packages.find]
include = ["neuroshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
